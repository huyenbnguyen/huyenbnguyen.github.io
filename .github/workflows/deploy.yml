name: Deploy to GitHub Pages

on:
  push:
    branches: 
      - '**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build a fully static site. nitro's `static` preset prerenders all routes
      # and emits the result into `.output/public`, which GitHub Pages can serve.
      - name: Build static site
        env:
          NITRO_PRESET: static
        run: bun run build

      - name: Add .nojekyll
        run: mkdir -p .output/public && touch .output/public/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          name: build-artifact
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact: build-artifact
          path: output-dir/ # The artifact unzips into this folder
