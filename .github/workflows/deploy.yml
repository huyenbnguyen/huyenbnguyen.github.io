name: Deploy to GitHub Pages

on:
  push:
    branches: 
      - '**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Build a fully static site. TanStack Start's prerenderer crawls all routes
      # and emits static HTML into `dist/client`, which GitHub Pages can serve.
      - name: Build static site
        run: bun run build

      - name: Add .nojekyll
        run: touch dist/client/.nojekyll

      - uses: actions/configure-pages@v5

      - name: Upload static files as artifact
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact: github-pages
          path: dist/client/ # The artifact unzips into this folder
